<!DOCTYPE html>
<html lang="en">
<head>
    <title>Monaco Editor - Doxie - Copyright (C) 2014-2025 Simon Mourier. All rights reserved.</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="./vs/editor/editor.main.css" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #container {
            height: 100%;
        }

        .highlight {
            --background: #ebe896;
            border-width: 2px;
            border-style: solid;
            border-color: #ebe896;
            padding: 0px 1px 0px 1px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="./vs/loader.js"></script>
    <script>require.config({ paths: { 'vs': './vs' } });</script>
    <script src="./vs/editor/editor.main.js"></script>
    <script src="./Languages/cobol.js"></script>
    <script>
        const oldLog = console.log;
        console.log = function () {
            const args = Array.prototype.slice.call(arguments);
            chrome.webview.hostObjects.dotnet.onEvent(14, JSON.stringify({ arguments: args }));
            oldLog.apply(console, arguments);
        };

        window.onerror = (message, source, lineno, colno, error) => { chrome.webview.hostObjects.dotnet.onEvent(15, JSON.stringify({ message: message, source: source, lineno: lineno, colno: colno, stack: error?.stack })); }

        chrome.webview.hostObjects.dotnet.onEvent(1);
        let editor;
        let suppressContentEvent = false;
        let highlights = null;

        function initializeMonaco() {
            // https://github.com/microsoft/vscode/blob/main/src/vs/platform/opener/common/opener.ts
            const openerService = {
                open: function (resource, options) {
                    chrome.webview.hostObjects.dotnet.onEvent(12, JSON.stringify({ resource: resource, options: options }));
                }
            };

            const jsonOptions = chrome.webview.hostObjects.sync.dotnet.getOptions();
            const options = JSON.parse(jsonOptions);

            monaco.editor.onDidCreateEditor(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(5);
            });

            editor = monaco.editor.create(document.getElementById('container'), options,
                {
                    openerService: openerService
                }
            );

            //monaco.editor.addKeybindingRules([
            //    {
            //        keybinding: monaco.KeyCode.F1,
            //        command: null,
            //    }
            //]);

            editor.getModel().onDidChangeContent(evt => {
                if (!suppressContentEvent) {
                    chrome.webview.hostObjects.dotnet.onEvent(2, JSON.stringify(evt));
                }
            });

            editor.onDidPaste(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(13, JSON.stringify(evt));
            });

            editor.onDidChangeModelLanguage(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(10, JSON.stringify(evt));
            });

            editor.onDidChangeConfiguration(evt => {
                // the index of the first option that changed, in the first array property of the event.
                const index = Object.values(evt).find(e => Array.isArray(e)).findIndex(v => v);
                if (index) {
                    chrome.webview.hostObjects.dotnet.onEvent(11, JSON.stringify({ index: index }));
                }
            });

            editor.onDidBlurEditorText(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(6, JSON.stringify(evt));
            });

            editor.onDidFocusEditorText(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(7, JSON.stringify(evt));
            });

            editor.onDidChangeCursorPosition(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(8, JSON.stringify(evt));
            });

            editor.onDidChangeCursorSelection(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(9, JSON.stringify(evt));
            });

            editor.onKeyUp(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(3, JSON.stringify(evt));
            });

            editor.onKeyDown(evt => {
                chrome.webview.hostObjects.dotnet.onEvent(4, JSON.stringify(evt));
            });
        }

        function getFindWidget() {
            return document.querySelector("div[widgetid='editor.contrib.findWidget'] textarea");
        }

        function moveFindWidgetToEnd() {
            const widget = getFindWidget();
            if (widget != document.activeElement)
                return;

            widget.setSelectionRange(Number.MAX_SAFE_INTEGER, Number.MAX_SAFE_INTEGER);
        }

        function moveFindWidgetToStart() {
            const widget = getFindWidget();
            if (widget != document.activeElement)
                return;

            widget.setSelectionRange(0, 0);
        }

        function highlightRanges(rangesJson) {
            const ranges = JSON.parse(rangesJson);
            if (ranges == undefined || ranges.length == 0)
                return;

            highlights = editor.createDecorationsCollection(ranges.map(range => ({
                range: range,
                options: {
                    inlineClassName: 'highlight',
                    minimap: {
                        color: '#ebe896',
                        position: 1
                    }
                }
            })));
        }

        function moveEditorTo(column, lineNumber) {
            if (column === undefined) {
                if (lineNumber === undefined)
                    return;

                column = editor.getPosition().column;
            }

            if (lineNumber === undefined) {
                lineNumber = editor.getPosition().lineNumber;
            }

            if (column == 2147483647) {
                column = editor.getModel().getLineLength(editor.getPosition().lineNumber) + 1;
            }

            if (lineNumber == 2147483647) {
                lineNumber = editor.getModel().getLineCount();
            }

            const position = { column: column, lineNumber: lineNumber };
            editor.setPosition(position);
            editor.revealPosition(position);
        }

        function loadFromHost() {
            highlights?.clear();
            highlights = null;
            suppressContentEvent = true;
            editor.setValue('');
            loadChunksFromHost();
        }

        // the load itself must not be undoable, so the undo stack starts from the loaded text.
        function resetUndoStack() {
            const model = editor.getModel();
            if (!model)
                return;

            model.setValue(model.getValue());
            suppressContentEvent = false;
            editor.setPosition({ lineNumber: 1, column: 1 });
            editor.setScrollPosition({ scrollTop: 0, scrollLeft: 0 });
        }

        async function loadChunksFromHost() {
            const text = await chrome.webview.hostObjects.dotnet.load();
            if (text === null) {
                resetUndoStack();
                return;
            }

            const lines = editor.getModel().getLineCount();
            const col = editor.getModel().getLineMaxColumn(lines);
            const range = new monaco.Range(lines, col, lines, col);
            editor.executeEdits('', [{ range: range, text: text }])
            setTimeout(loadChunksFromHost, 0);
        }

    </script>
</body>
</html>
